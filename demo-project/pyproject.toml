[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-task-service"
version = "0.2.0"
description = "Small FastAPI + vanilla frontend app for simulation and autopsy exercises."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.scripts]
task-service = "task_service.main:main"

